<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Project Time Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 sm:p-8">

    <header class="mb-8 max-w-6xl mx-auto">
        <h1 class="text-4xl font-black text-indigo-700 tracking-tight">College Project Tracker</h1>
        <p class="text-gray-500">Log working hours and generate weekly timesheets for your college submissions.</p>
    </header>

    <div class="max-w-6xl mx-auto flex mb-6 border-b border-gray-200">
        <button id="tracker-tab" onclick="switchView('tracker')"
            class="py-2 px-4 text-lg font-semibold transition-colors duration-200 text-indigo-600 border-b-2 border-indigo-600">
            Tracker & Log
        </button>
        <button id="reports-tab" onclick="switchView('reports')"
            class="py-2 px-4 text-lg font-semibold transition-colors duration-200 text-gray-500 hover:text-indigo-600">
            Weekly Reports
        </button>
    </div>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div id="tracker-view" class="lg:col-span-3 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 p-6 bg-white rounded-xl shadow-2xl space-y-6">
                <h2 class="text-2xl font-bold text-gray-900">Live Timer</h2>
                
                <div class="flex flex-col md:flex-row gap-4 items-center">
                    <select id="project-selector"
                        class="flex-grow p-3 border-2 border-indigo-400 focus:ring-indigo-500 focus:border-indigo-500 rounded-lg text-lg font-medium transition duration-150"
                        onchange="updateTimerState()">
                        <option value="" disabled selected>Select a Project...</option>
                    </select>

                    <div id="timer-display"
                        class="p-3 w-40 text-center rounded-lg font-mono-custom text-2xl bg-gray-100 text-gray-600 transition duration-300">
                        00:00:00
                    </div>
                    
                    <button id="timer-button" onclick="handleTimerClick()"
                        class="p-3 w-full md:w-32 rounded-lg text-white font-bold transition duration-200 shadow-md bg-green-600 hover:bg-green-700 disabled:bg-gray-400">
                        START
                    </button>
                </div>

                <p id="timer-error" class="text-red-500 text-sm font-medium hidden"></p>

                <div class="pt-4 border-t border-gray-200">
                    <h3 class="text-xl font-semibold text-gray-700 mb-3">Today's Activity (<span id="today-entry-count">0</span> entries)</h3>
                    <div id="today-log" class="space-y-2 max-h-64 overflow-y-auto no-scrollbar pr-2">
                        <p class="text-gray-500 italic" id="no-log-message">No time logged today. Start a timer!</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1 p-4 bg-white rounded-lg shadow-md">
                <h3 class="text-lg font-semibold text-gray-700 mb-3">Manage Projects</h3>
                
                <form id="add-project-form" class="flex space-x-2 mb-4">
                    <input type="text" id="new-project-name" placeholder="New Project Name (e.g., Thesis)"
                        class="flex-grow p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" />
                    <button type="submit"
                        class="px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition duration-150">
                        Add
                    </button>
                </form>

                <p id="project-error" class="text-red-500 text-sm mb-2 hidden"></p>
                
                <ul id="project-list" class="space-y-2 max-h-48 overflow-y-auto no-scrollbar pr-2">
                    </ul>
            </div>
        </div>

        <div id="reports-view" class="lg:col-span-3 hidden">
            <div class="p-6 bg-white rounded-xl shadow-2xl space-y-6">
                <h2 class="text-3xl font-extrabold text-gray-900">Weekly Timesheet Report</h2>
                
                <div class="flex items-center space-x-3">
                    <label for="week-selector" class="text-lg text-gray-700 font-semibold">Viewing Week:</label>
                    <select id="week-selector" onchange="renderReport()"
                        class="p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-base font-medium">
                        </select>
                    <p id="week-range" class="text-lg text-indigo-600 font-semibold"></p>
                </div>

                <div id="report-content">
                    </div>
                
                <button onclick="exportReport()" class="px-4 py-2 bg-gray-800 text-white font-medium rounded-lg hover:bg-gray-700 transition duration-150">
                    Export Timesheet (CSV)
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
